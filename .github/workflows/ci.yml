# cube_db CI — 推代码 / 开 PR 时自动: 装 zig → 准备 zio → 编译 → 全量测试
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # 1. 把你的仓库代码下载到 CI 机器
      - uses: actions/checkout@v4

      # 2. 安装 Zig 0.16.0(与本地 .tool-versions/asdf 一致)
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      # 3. zio 依赖: build.zig.zon 用 .path = "../zio"(兄弟目录),CI 上不存在
      #    所以先把它 clone 到仓库的上一级。固定 commit 保证可复现:
      #    本地验证过的版本是 3aa3423,后续升级 zio 时改这里。
      - name: Clone zio dependency to ../zio
        run: |
          git clone --depth 1 https://github.com/lalinsky/zio.git ../zio
          cd ../zio && git fetch --depth 1 origin 3aa3423 && git checkout 3aa3423

      # 4. 编译检查(快,~1min)— 任何模块编译失败这里就红
      - name: Compile (zig build)
        run: zig build

      # 5. 全量测试 = 项目验收命令(编译 + 全部 unit/integration tests)
      #    已知问题: tests/txn_test.zig 的 concurrency 测试存在真实竞态(间歇 SEGV/ABRT),
      #    会让本步随机红 —— 这是引擎的 bug,修好前 CI 不能保证稳定。
      #    修复后去掉本注释。不要用 retry 掩盖它,竞态是真实缺陷。
      - name: Run full test suite
        run: zig build test

      # 6. 基准回归检查(先注释掉: 阈值按本机 M1 Pro 校准,CI 的 CPU 不同会误报)
      #    待 bench_baseline 支持 mem-only 模式后再启用。
      # - name: Benchmark regression baseline
      #   run: zig build bench-baseline -Doptimize=ReleaseFast
